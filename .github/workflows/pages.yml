# Deploys the static site to GitHub Pages.
#
# There is no build here on purpose. `build.py` runs locally and its output is
# committed, so this workflow only copies files -- a bug in the generator can
# never take the live site down.
name: Deploy to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Denylist, so new pages and assets publish automatically and only new
      # *non-site* files ever need an entry here.
      #
      # videos/ is the one exception. The repo keeps all 16 rollout clips, but
      # only the three the report embeds are worth shipping -- the other 13 are
      # ~47 MB of artifact nobody downloads. rsync takes the first matching
      # rule, so the includes must come before the exclude.
      - name: Stage site
        run: |
          mkdir -p _site
          rsync -a \
            --include='videos/410m_orange2.mp4' \
            --include='videos/410m_pushbox_fail.mp4' \
            --include='videos/410m_pushbox_w.mp4' \
            --exclude='videos/*' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.claude' \
            --exclude='_site' \
            --exclude='content' \
            --exclude='build.py' \
            --exclude='CLAUDE.md' \
            --exclude='__pycache__' \
            ./ _site/
          echo "--- staged ---"
          find _site -type f -not -path '*/videos/*' | sort
          echo "videos staged: $(find _site/videos -type f | wc -l)  ($(du -sh _site/videos | cut -f1))"
          echo "artifact size: $(du -sh _site | cut -f1)"

      # The include list above is an allowlist, so a future post embedding a
      # different clip would silently ship a broken <video>. Fail loudly instead.
      - name: Check every embedded video was staged
        run: |
          missing=0
          for v in $(grep -rho '/videos/[A-Za-z0-9_]*\.mp4' _site --include='*.html' | sort -u); do
            if [ -f "_site${v}" ]; then
              echo "ok      ${v}"
            else
              echo "MISSING ${v}  -- add it to the rsync --include list in this workflow"
              missing=1
            fi
          done
          exit $missing

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
