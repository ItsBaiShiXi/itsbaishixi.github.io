{{ $src := .Get "src" }}
{{ $alt := .Get "alt" }}
{{ $caption := .Get "caption" }}
{{ $class := .Get "class" | default "" }}
<figure class="report-figure {{ $class }}">
  <img src="{{ $src | relURL }}" alt="{{ $alt }}" loading="lazy" />
  {{ with $caption }}
    <figcaption>{{ . | markdownify }}</figcaption>
  {{ end }}
</figure>
