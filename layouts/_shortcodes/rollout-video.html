{{ $src := .Get "src" }}
{{ $title := .Get "title" }}
{{ $caption := .Get "caption" }}
{{ $staticPath := printf "static/%s" (strings.TrimPrefix "/" $src) }}
<figure class="rollout-media">
  {{ if fileExists $staticPath }}
    <video controls preload="metadata" aria-label="{{ $title }}">
      <source src="{{ $src | relURL }}" type="video/mp4" />
      Your browser does not support embedded video.
    </video>
  {{ else }}
    <div class="video-placeholder" role="img" aria-label="Video placeholder: {{ $title }}">
      <span class="video-icon" aria-hidden="true"></span>
      <strong>{{ $title }}</strong>
      <span>Rollout video coming soon</span>
      <code>{{ $src }}</code>
    </div>
  {{ end }}
  {{ with $caption }}
    <figcaption>{{ . | markdownify }}</figcaption>
  {{ end }}
</figure>
